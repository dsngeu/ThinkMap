<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thinkmap</title>
<style>
:root {
  --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f1f3f6; --surface-3: #e9ecf1;
  --text: #0f172a; --muted: #5b6474; --faint: #9aa3b2; --border: #e5e8ed; --line: #d5dae2;
  --accent: #4f46e5; --accent-2: #7c3aed;
  --ok: #16a34a; --ask: #d97706; --risk: #dc2626; --build: #2563eb; --talk: #7c3aed; --idle: #94a3b8;
  --shadow: 0 1px 2px rgba(15,23,42,.04), 0 6px 20px rgba(15,23,42,.06);
  --shadow-hi: 0 2px 4px rgba(15,23,42,.06), 0 16px 40px rgba(15,23,42,.12);
  --radius: 16px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b0d12; --surface: #13161d; --surface-2: #191d26; --surface-3: #222734;
    --text: #e8ebf1; --muted: #a0a9b8; --faint: #6b7586; --border: #242a36; --line: #303747;
    --accent: #818cf8; --accent-2: #a78bfa;
    --ok: #34d399; --ask: #fbbf24; --risk: #f87171; --build: #60a5fa; --talk: #a78bfa; --idle: #6b7586;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    --shadow-hi: 0 2px 4px rgba(0,0,0,.35), 0 18px 44px rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b0d12; --surface: #13161d; --surface-2: #191d26; --surface-3: #222734;
  --text: #e8ebf1; --muted: #a0a9b8; --faint: #6b7586; --border: #242a36; --line: #303747;
  --accent: #818cf8; --accent-2: #a78bfa;
  --ok: #34d399; --ask: #fbbf24; --risk: #f87171; --build: #60a5fa; --talk: #a78bfa; --idle: #6b7586;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
  --shadow-hi: 0 2px 4px rgba(0,0,0,.35), 0 18px 44px rgba(0,0,0,.45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; overflow: hidden; }
a { color: inherit; text-decoration: none; }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .86em; background: var(--surface-2); padding: 1px 5px; border-radius: 5px; overflow-wrap: anywhere; }
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
h1, h2, h3, h4, p { margin: 0; }
.ic { width: 18px; height: 18px; flex: none; }
.muted { color: var(--muted); }
.t-ok { --t: var(--ok); } .t-ask { --t: var(--ask); } .t-risk { --t: var(--risk); } .t-build { --t: var(--build); } .t-talk { --t: var(--talk); } .t-idle { --t: var(--idle); } .t-accent { --t: var(--accent); }

/* ---------- top bar ---------- */
header { flex: none; height: 60px; display: flex; align-items: center; gap: 14px; padding: 0 22px; background: color-mix(in srgb, var(--surface) 85%, transparent); backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--border); position: relative; z-index: 10; }
.logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; white-space: nowrap; }
.mark { width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; color: #fff; box-shadow: 0 4px 12px color-mix(in srgb, var(--accent) 35%, transparent); }
.mark svg { width: 16px; height: 16px; }
.crumbs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; font-size: 14px; color: var(--muted); padding-left: 10px; border-left: 1px solid var(--border); }
.crumbs a { padding: 4px 8px; border-radius: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px; }
.crumbs a:hover { background: var(--surface-2); color: var(--text); }
.crumbs a:last-child { color: var(--text); font-weight: 600; }
.crumbs .sep { color: var(--faint); flex: none; display: grid; }
.crumbs .sep .ic { width: 14px; height: 14px; }
.grow { flex: 1; }
.tbtn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); font-size: 13.5px; white-space: nowrap; transition: border-color .15s, color .15s, background .15s; }
.tbtn:hover { color: var(--text); border-color: var(--line); }
.tbtn.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.tbtn kbd { font: 11px ui-monospace, Menlo, monospace; padding: 2px 6px; border-radius: 5px; background: var(--surface-2); color: var(--muted); }
.tbtn.need { color: color-mix(in srgb, var(--ask) 75%, var(--text)); border-color: color-mix(in srgb, var(--ask) 40%, var(--border)); background: color-mix(in srgb, var(--ask) 8%, var(--surface)); font-weight: 600; }
.tbtn.need .n { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 99px; background: var(--ask); color: #fff; font-size: 12px; display: inline-grid; place-items: center; }
.live { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
.live.on { background: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 18%, transparent); }
.live.off { background: var(--risk); }

/* ---------- page ---------- */
#main { flex: 1; min-height: 0; overflow: auto; position: relative; }
#page { max-width: 1080px; margin: 0 auto; padding: 36px 32px 96px; }
#page.enter > * { animation: rise .38s cubic-bezier(.2,.8,.2,1) both; }
#page.enter > *:nth-child(2) { animation-delay: .04s; } #page.enter > *:nth-child(3) { animation-delay: .08s; } #page.enter > *:nth-child(n+4) { animation-delay: .12s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@media (prefers-reduced-motion: reduce) { #page.enter > * { animation: none; } }

.eyebrow { font-size: 12.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.eyebrow .ic { width: 15px; height: 15px; }
h1 { font-size: 34px; line-height: 1.15; letter-spacing: -.025em; font-weight: 750; margin-top: 8px; }
.lede { color: var(--muted); font-size: 16.5px; max-width: 720px; margin-top: 10px; }
.lede p { margin: 4px 0; }
.lede ul { margin: 6px 0; padding-left: 20px; }
h2.sec { font-size: 19px; letter-spacing: -.01em; font-weight: 700; display: flex; align-items: baseline; gap: 10px; }
h2.sec .n { font-size: 14px; font-weight: 500; color: var(--faint); }
.sechead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin: 44px 0 16px; }
.sechead p { color: var(--muted); font-size: 14px; margin-top: 4px; }

.pill { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 11px; border-radius: 99px; font-size: 12.5px; font-weight: 600; white-space: nowrap; color: color-mix(in srgb, var(--t) 80%, var(--text)); background: color-mix(in srgb, var(--t) 13%, transparent); text-transform: none; letter-spacing: 0; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--t); }
.pill .ic { width: 14px; height: 14px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
:where(a.card) { display: block; }
a.card { transition: transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s, border-color .18s; }
a.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-hi); border-color: var(--line); }

/* ring */
.ring { position: relative; display: inline-block; width: 56px; height: 56px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .bg { stroke: var(--surface-3); }
.ring .fg { stroke: var(--t); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 13px; font-weight: 700; letter-spacing: -.02em; }
.ring.big { width: 120px; height: 120px; }
.ring.big b { font-size: 28px; }
.ring.sm { width: 42px; height: 42px; }
.ring.sm b { font-size: 11px; }

/* ---------- home ---------- */
.hero { display: grid; grid-template-columns: 1fr auto; gap: 32px; align-items: center; padding: 34px 36px; border-radius: 24px; background:
  radial-gradient(900px 300px at 0% 0%, color-mix(in srgb, var(--accent) 11%, transparent), transparent 60%),
  radial-gradient(600px 300px at 100% 100%, color-mix(in srgb, var(--accent-2) 10%, transparent), transparent 60%), var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); }
.hero h1 { font-size: 40px; }
.hero .facts { display: flex; flex-wrap: wrap; gap: 10px 22px; margin-top: 20px; font-size: 14px; color: var(--muted); }
.hero .facts b { color: var(--text); font-weight: 650; }
.hero .side { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.hero .side span { font-size: 13px; color: var(--muted); }

.attention { margin-top: 22px; display: grid; grid-template-columns: auto 1fr auto; gap: 20px; align-items: center; padding: 20px 24px; border-radius: 20px; background: color-mix(in srgb, var(--ask) 7%, var(--surface)); border: 1px solid color-mix(in srgb, var(--ask) 28%, var(--border)); }
.attention .big { width: 52px; height: 52px; border-radius: 14px; background: var(--ask); color: #fff; display: grid; place-items: center; font-size: 22px; font-weight: 750; }
.attention h3 { font-size: 17px; letter-spacing: -.01em; }
.attention ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; min-width: 0; }
.attention li a { display: flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); min-width: 0; }
.attention li a:hover { color: var(--text); }
.attention li a .ic { width: 15px; height: 15px; color: var(--ask); }
.attention li a span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.attention li a em { font-style: normal; color: var(--faint); font-size: 12.5px; white-space: nowrap; flex: none; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 11px; font-weight: 600; font-size: 14px; background: var(--text); color: var(--bg); white-space: nowrap; transition: transform .15s, opacity .15s; }
.btn:hover { transform: translateY(-1px); opacity: .92; }
.btn.soft { background: var(--surface); color: var(--text); border: 1px solid var(--border); height: 34px; }
.btn .ic { width: 16px; height: 16px; }
.allclear { margin-top: 22px; display: flex; gap: 14px; align-items: center; padding: 16px 22px; border-radius: 18px; background: color-mix(in srgb, var(--ok) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--ok) 25%, var(--border)); color: var(--muted); }
.allclear .ic { color: var(--ok); width: 22px; height: 22px; }

/* roadmap */
.road { list-style: none; margin: 0; padding: 0; position: relative; }
.road::before { content: ""; position: absolute; left: 27px; top: 34px; bottom: 34px; width: 2px; background: var(--line); border-radius: 2px; }
.road li { position: relative; padding-left: 72px; margin-bottom: 14px; }
.road .node { position: absolute; left: 8px; top: 50%; margin-top: -20px; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 15px; background: var(--surface); border: 2px solid var(--line); color: var(--muted); z-index: 1; }
.road .done .node { background: var(--ok); border-color: var(--ok); color: #fff; }
.road .now .node { background: var(--accent); border-color: var(--accent); color: #fff; box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 18%, transparent); }
.road .todo .node { border-style: dashed; }
.road .node .ic { width: 18px; height: 18px; stroke-width: 2.6; }
.stepcard { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding: 20px 22px; }
.road .now .stepcard { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 8%, transparent), var(--shadow); }
.road .todo .stepcard { background: transparent; box-shadow: none; border-style: dashed; }
.stepcard .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stepcard h3 { font-size: 18px; letter-spacing: -.01em; }
.stepcard p { color: var(--muted); font-size: 14px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.stepcard .sub { font-size: 13px; color: var(--faint); margin-top: 8px; }
.here { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }

.duo { display: grid; grid-template-columns: 1.4fr 1fr; gap: 22px; }
.feed { padding: 6px; }
.feed a { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 10px; }
.feed a:hover { background: var(--surface-2); }
.feed .t { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed .d { font-size: 12.5px; color: var(--faint); white-space: nowrap; }
.dotic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; color: var(--t); background: color-mix(in srgb, var(--t) 13%, transparent); flex: none; }
.dotic .ic { width: 16px; height: 16px; }
.minis { display: grid; gap: 12px; }
.mini { display: flex; align-items: center; gap: 14px; padding: 16px 18px; }
.mini .t { font-weight: 600; font-size: 14.5px; }
.mini .s { font-size: 13px; color: var(--muted); }
.mini .go { margin-left: auto; color: var(--faint); display: grid; }

/* ---------- phase: topic grid ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.tcard { padding: 20px; display: flex; flex-direction: column; gap: 12px; min-height: 172px; }
.tcard .row1 { display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; }
.tcard h3 { font-size: 16.5px; line-height: 1.35; letter-spacing: -.01em; }
.tcard .desc { color: var(--muted); font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tcard .foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--faint); }
.tcard.needs { border-color: color-mix(in srgb, var(--ask) 45%, var(--border)); }
.phasehead { display: grid; grid-template-columns: 1fr auto; gap: 28px; align-items: center; }
.stats { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
.stat { padding: 12px 16px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); min-width: 120px; }
.stat b { display: block; font-size: 20px; letter-spacing: -.02em; color: var(--t, var(--text)); }
.stat span { font-size: 12.5px; color: var(--muted); }

/* ---------- topic: tabs + lists ---------- */
.tabs { display: flex; gap: 4px; padding: 4px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); margin-top: 30px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs a { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 10px; font-size: 14px; font-weight: 550; color: var(--muted); white-space: nowrap; }
.tabs a:hover { color: var(--text); }
.tabs a.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.tabs a .ic { width: 16px; height: 16px; color: var(--t); }
.tabs a .n { font-size: 12px; color: var(--faint); font-weight: 600; }
.tabhint { color: var(--muted); font-size: 14px; margin: 18px 4px 12px; }
.list { overflow: hidden; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; padding: 15px 18px; border-top: 1px solid var(--border); transition: background .15s; }
.item:first-child { border-top: 0; }
.item:hover { background: var(--surface-2); }
.item .t { font-weight: 600; font-size: 15px; line-height: 1.4; }
.item .s { font-size: 13.5px; color: var(--muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.item .r { display: flex; align-items: center; gap: 10px; color: var(--faint); font-size: 13px; white-space: nowrap; }
.item .r .ic { width: 16px; height: 16px; }
.item.dropped .t { text-decoration: line-through; color: var(--muted); }
.group { font-size: 12.5px; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 28px 4px 10px; display: flex; gap: 8px; align-items: center; }
.group a:hover { color: var(--text); }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); }
.empty .ic { width: 34px; height: 34px; color: var(--ok); margin-bottom: 10px; }
.empty h3 { color: var(--text); font-size: 17px; margin-bottom: 4px; }

/* ---------- note + ticket reading page ---------- */
.reader { max-width: 760px; margin: 0 auto; }
.reader h1 { font-size: 30px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; color: var(--muted); font-size: 14px; margin-top: 14px; }
.meta .ic { width: 15px; height: 15px; vertical-align: -3px; }
.meta a { color: var(--accent); }
.blocks { display: grid; gap: 14px; margin-top: 28px; }
.block { padding: 18px 22px; border-left: 4px solid var(--t); border-radius: 6px var(--radius) var(--radius) 6px; }
.block .lbl { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--t); margin-bottom: 6px; }
.block p { margin: 3px 0; }
.block ul { margin: 4px 0; padding-left: 20px; }
.callout { display: flex; gap: 14px; padding: 16px 18px; border-radius: 14px; background: color-mix(in srgb, var(--t) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--t) 25%, var(--border)); margin-top: 18px; font-size: 14px; color: var(--muted); }
.callout > .ic { color: var(--t); margin-top: 2px; }
.callout b { color: var(--text); }
.callout a { color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 30px; }
.actions a, .actions button { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 12px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); font-size: 13px; color: var(--muted); }
.actions a:hover, .actions button:hover { color: var(--text); border-color: var(--line); }
.actions .ic { width: 15px; height: 15px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 40px; }
.pager a { padding: 16px 18px; }
.pager .k { font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; }
.pager .k .ic { width: 14px; height: 14px; }
.pager .t { font-weight: 600; font-size: 14.5px; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pager .next { text-align: right; }
.pager .next .k { justify-content: flex-end; }
.doc { padding: 6px 24px 18px; }
.doc h2 { font-size: 17px; margin: 18px 0 6px; } .doc h3 { font-size: 15px; margin: 16px 0 6px; } .doc h4 { font-size: 14px; margin: 12px 0 4px; }
.doc p { margin: 8px 0; } .doc ul { padding-left: 22px; margin: 8px 0; } .doc li { margin: 6px 0; }
.doc li.cb { list-style: none; margin-left: -22px; display: flex; gap: 10px; }
.box { flex: none; width: 18px; height: 18px; border-radius: 6px; border: 2px solid var(--line); margin-top: 3px; display: grid; place-items: center; }
.box.x { background: var(--ok); border-color: var(--ok); color: #fff; }
.box .ic { width: 12px; height: 12px; stroke-width: 3; }
.doc blockquote { margin: 6px 0; padding: 2px 12px; border-left: 3px solid var(--line); color: var(--muted); }
pre { background: var(--surface-2); padding: 12px 14px; border-radius: 10px; overflow: auto; font: 12.5px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
.stepper { display: flex; align-items: center; margin-top: 26px; }
.stepper .st { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--faint); font-weight: 550; white-space: nowrap; }
.stepper .st i { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-style: normal; font-size: 12px; }
.stepper .st.done { color: var(--muted); } .stepper .st.done i { background: var(--ok); border-color: var(--ok); color: #fff; }
.stepper .st.cur { color: var(--text); } .stepper .st.cur i { border-color: var(--t); background: var(--t); color: #fff; }
.stepper .st i .ic { width: 13px; height: 13px; stroke-width: 3; }
.stepper .ln { flex: 1; height: 2px; background: var(--line); margin: 0 12px; min-width: 20px; }
.stepper .ln.done { background: var(--ok); }
.log { position: relative; padding-left: 22px; }
.log::before { content: ""; position: absolute; left: 6px; top: 8px; bottom: 8px; width: 2px; background: var(--line); }
.log div { position: relative; padding: 4px 0 10px; font-size: 14px; color: var(--muted); }
.log div::before { content: ""; position: absolute; left: -21px; top: 11px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--accent); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-top: 22px; }
.kv div { padding: 12px 14px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); min-width: 0; }
.kv span { display: block; font-size: 12px; color: var(--faint); }
.kv b { font-weight: 600; font-size: 14px; overflow-wrap: anywhere; }
.kv a { color: var(--accent); }
.issue { padding: 14px 18px; border-top: 1px solid var(--border); font-size: 14px; }
.issue:first-child { border-top: 0; }
.ftabs { display: inline-flex; padding: 3px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); }
.ftabs button { height: 30px; padding: 0 12px; border-radius: 8px; font-size: 13px; color: var(--muted); }
.ftabs button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.fm { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 6px; margin: 16px 0; }
.fm div { background: var(--surface-2); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; overflow-wrap: anywhere; }
.fm b { color: var(--muted); font-weight: 500; margin-right: 6px; }
mark.hl { background: color-mix(in srgb, var(--ask) 30%, transparent); color: inherit; border-radius: 4px; padding: 1px 3px; }
.raw { font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; padding: 12px 0; overflow: auto; }
.raw div { display: flex; white-space: pre; padding: 0 14px; }
.raw .ln { width: 38px; flex: none; text-align: right; color: var(--faint); margin-right: 14px; user-select: none; }
.raw .hlrow { background: color-mix(in srgb, var(--ask) 18%, transparent); }

/* ---------- search palette ---------- */
#palette { position: fixed; inset: 0; z-index: 50; background: rgba(8,10,15,.42); backdrop-filter: blur(3px); display: flex; justify-content: center; align-items: flex-start; padding: 12vh 16px 16px; }
.pal { width: 100%; max-width: 640px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; box-shadow: 0 30px 80px rgba(0,0,0,.35); overflow: hidden; animation: pop .18s cubic-bezier(.2,.8,.2,1); }
@keyframes pop { from { opacity: 0; transform: translateY(-8px) scale(.98); } }
.pal .in { display: flex; align-items: center; gap: 12px; padding: 0 18px; border-bottom: 1px solid var(--border); color: var(--faint); }
.pal input { flex: 1; height: 58px; border: 0; outline: 0; background: none; color: var(--text); font: inherit; font-size: 17px; min-width: 0; }
.pal .res { max-height: 56vh; overflow: auto; padding: 8px; }
.pal .gh { font-size: 11.5px; font-weight: 650; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); padding: 10px 12px 6px; }
.pal .hit { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 8px 12px; border-radius: 10px; }
.pal .hit.on { background: var(--surface-2); }
.pal .hit .t { font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pal .hit .s { font-size: 12.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; }
.pal .none { padding: 30px; text-align: center; color: var(--muted); }
.pal .foot { display: flex; gap: 16px; padding: 10px 18px; border-top: 1px solid var(--border); font-size: 12px; color: var(--faint); }
.pal kbd { font: 11px ui-monospace, Menlo, monospace; padding: 1px 6px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--border); }

/* ---------- tooling ---------- */
.tools { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.tool { padding: 18px; display: flex; gap: 14px; }
.tool .t { font-weight: 650; font-size: 15px; overflow-wrap: anywhere; }
.tool .s { font-size: 13.5px; color: var(--muted); margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tool .k { font-size: 12.5px; color: var(--t); margin-top: 8px; overflow-wrap: anywhere; }
.tool > span:not(.dotic) { min-width: 0; flex: 1; }
.cat .s { -webkit-line-clamp: 3; }
.cat .need { font-size: 12.5px; color: var(--faint); margin-top: 6px; }
.cat .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; }
.cat .row a, .cat .row button { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); font-size: 12.5px; font-weight: 600; color: var(--muted); }
.cat .row a:hover, .cat .row button:hover { color: var(--text); border-color: var(--line); }
.cat .row .go { background: var(--text); color: var(--bg); border-color: var(--text); }
.cat .row .go:hover { color: var(--bg); opacity: .88; }
.cat .row .warn, .cat .row .warn:hover { color: var(--risk); border-color: color-mix(in srgb, var(--risk) 45%, var(--border)); }
.cat .row button:disabled { opacity: .55; cursor: progress; }
.cat .row .ic { width: 14px; height: 14px; }
.cat .msg { font-size: 12.5px; margin-top: 10px; color: var(--t); overflow-wrap: anywhere; }

/* ---------- mind map (second view) ---------- */
#stage { position: absolute; inset: 0; overflow: auto; background: radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0 / 22px 22px; }
#canvas { position: relative; }
#links { position: absolute; left: 0; top: 0; pointer-events: none; overflow: visible; }
#links path { fill: none; stroke: var(--line); stroke-width: 2; transition: opacity .25s; }
#links path.ghost { opacity: 0; }
.mcard { position: absolute; display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); transition: left .38s cubic-bezier(.2,.8,.2,1), top .38s cubic-bezier(.2,.8,.2,1), opacity .25s, box-shadow .15s; cursor: pointer; }
.mcard.ghost { opacity: 0; pointer-events: none; }
.mcard:hover { box-shadow: var(--shadow-hi); z-index: 2; }
.mcard.sel { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 45%, transparent); }
.mcard .body { flex: 1; min-width: 0; }
.mcard .t { font-weight: 650; font-size: 14px; line-height: 1.3; }
.mcard .s { font-size: 12px; color: var(--muted); margin-top: 2px; }
.mcard.point .t, .mcard.ticket .t { font-weight: 500; font-size: 13.5px; }
.mcard.point.dropped .t { text-decoration: line-through; color: var(--muted); }
.mcard.project { border: 2px solid var(--accent); }
.mcard.project .t { font-size: 17px; }
.mcard .more { flex: none; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 99px; border: 1.5px solid var(--line); font-size: 12px; font-weight: 650; display: grid; place-items: center; color: var(--muted); }
.mcard.open .more { background: var(--text); color: var(--bg); border-color: var(--text); }
.mcard .goto { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; color: var(--faint); }
.mcard .goto:hover { background: var(--accent); color: #fff; }
.mcard .goto .ic { width: 14px; height: 14px; }
.maptools { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 5; display: flex; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 7px 7px 7px 16px; font-size: 13px; color: var(--muted); box-shadow: var(--shadow-hi); white-space: nowrap; }

.pop { position: absolute; right: 22px; top: 66px; z-index: 30; width: 360px; max-width: calc(100vw - 32px); padding: 16px 18px; font-size: 14px; }
.pop p { margin: 6px 0; }

/* ---------- phone ---------- */
@media (max-width: 760px) {
  header { padding: 0 14px; gap: 8px; height: 56px; }
  .logo b, .tbtn .lbl, .tbtn kbd, .crumbs { display: none; }
  .tbtn { padding: 0 10px; }
  #page { padding: 22px 16px 80px; }
  h1, .hero h1, .reader h1 { font-size: 26px; }
  .hero { grid-template-columns: 1fr; padding: 24px 20px; gap: 16px; }
  .hero .side { flex-direction: row; justify-content: flex-start; }
  .ring.big { width: 80px; height: 80px; } .ring.big b { font-size: 19px; }
  .attention { grid-template-columns: auto 1fr; padding: 18px; gap: 14px; }
  .attention .btn { grid-column: 1 / -1; justify-content: center; }
  .road::before { left: 19px; } .road li { padding-left: 52px; } .road .node { left: 0; width: 38px; height: 38px; margin-top: -19px; }
  .stepcard { grid-template-columns: 1fr; padding: 16px 18px; } .stepcard .ring { display: none; }
  .duo { grid-template-columns: 1fr; }
  .phasehead { grid-template-columns: 1fr; } .phasehead > .ring { display: none; }
  .grid { grid-template-columns: 1fr; }
  .item { grid-template-columns: auto 1fr; padding: 14px; } .item .r { display: none; }
  .pager { grid-template-columns: 1fr; }
  .sechead { flex-direction: column; align-items: flex-start; }
  .maptools .hint { display: none; }
  .stepper .st { font-size: 12px; }
}
</style>

<body>
<header>
  <a class="logo" href="#/" title="Home"><span class="mark" id="markIc"></span><b>Thinkmap</b></a>
  <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
  <span class="grow"></span>
  <button class="tbtn" id="searchBtn" title="Search (⌘K or /)"><span id="searchIc"></span><span class="lbl">Search</span><kbd>⌘K</kbd></button>
  <a class="tbtn need" id="needBtn" href="#/inbox" hidden title="Questions and ideas waiting for your decision"><span class="lbl">Needs you</span><span class="n" id="needN"></span></a>
  <a class="tbtn" id="mapBtn" href="#/map" title="Mind map view"><span id="mapIc"></span><span class="lbl">Map</span></a>
  <button class="tbtn" id="updBtn" hidden title="A newer Thinkmap is on GitHub">Update</button>
  <span class="live" id="live" title="connecting…"></span>
</header>
<div class="card pop" id="updbox" hidden>
  <p>Thinkmap <b id="updLatest"></b> is on GitHub; this is <b id="updCur"></b>. In a terminal, from your project:</p>
  <pre id="updHow"></pre>
  <p class="muted">Then run <code>/thinkmap</code> again; it replaces the old server.</p>
</div>
<main id="main">
  <div id="page"></div>
  <div id="stage" hidden><div id="canvas"><svg id="links"></svg><div id="content"></div></div></div>
  <div class="maptools" id="maptools" hidden><span class="hint">Click a card to unfold it · click a note to read it</span><button class="btn soft" id="collapseBtn">Fold all</button></div>
</main>
<div id="palette" hidden><div class="pal" role="dialog" aria-label="Search">
  <div class="in"><span id="palIc"></span><input id="q" placeholder="Search decisions, questions, tickets…" autocomplete="off" spellcheck="false"></div>
  <div class="res" id="res"></div>
  <div class="foot"><span><kbd>↑</kbd> <kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
</div></div>

<script>
(() => {
  // ---------- icons: simple line icons drawn inline (no libraries) ----------
  const P = {
    check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>',
    ask: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.3c-.6.3-1 .9-1 1.6v.4"/><path d="M12 17h.01"/>',
    idea: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1.1 1.3 1.1 2.1V16h5v-.1c0-.8.5-1.6 1.1-2.1A6 6 0 0 0 12 3z"/>',
    risk: '<path d="M12 3.5l9 16H3z"/><path d="M12 10v4M12 17h.01"/>',
    talk: '<path d="M4 5h16v11H9l-5 4z"/>',
    drop: '<circle cx="12" cy="12" r="9"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/>',
    ticket: '<rect x="3.5" y="5" width="17" height="14" rx="3"/><path d="M8 10h8M8 14h5"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.8-3.8"/>',
    map: '<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.3 11l7.4-3.8M8.3 13l7.4 3.8"/>',
    chev: '<path d="M9 6l6 6-6 6"/>',
    left: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
    right: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>',
    tools: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
    file: '<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/>',
    edit: '<path d="M4 20h4L19.5 8.5l-4-4L4 16z"/>',
    copy: '<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8"/>',
    warn: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/>',
    logo: '<circle cx="12" cy="5.5" r="2.2"/><circle cx="5.5" cy="17" r="2.2"/><circle cx="18.5" cy="17" r="2.2"/><path d="M11 7.5L6.6 15M13 7.5l4.4 7.5M8 17h8"/>',
    up: '<path d="M7 17L17 7M9 7h8v8"/>',
    layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    trash: '<path d="M4 7h16M10 11v6M14 11v6"/><path d="M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12"/><path d="M9 7V4h6v3"/>',
  };
  const icon = (n) => `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n] || ''}</svg>`;

  // ---------- vocabulary ----------
  const KIND = {
    open: { ic: 'ask', tone: 'ask', tab: 'decide', one: 'Open question' },
    suggestion: { ic: 'idea', tone: 'ask', tab: 'decide', one: 'Suggestion' },
    caution: { ic: 'risk', tone: 'risk', tab: 'care', one: 'Take care' },
    decided: { ic: 'check', tone: 'ok', tab: 'decided', one: 'Decided' },
    discussed: { ic: 'talk', tone: 'talk', tab: 'discussed', one: 'Discussed' },
    dropped: { ic: 'drop', tone: 'idle', tab: 'dropped', one: 'Dropped' },
  };
  const TABS = [
    { key: 'decide', label: 'To decide', ic: 'ask', tone: 'ask', kinds: ['open', 'suggestion'], hint: 'Questions and ideas waiting for a decision.' },
    { key: 'decided', label: 'Decided', ic: 'check', tone: 'ok', kinds: ['decided'], hint: 'What was agreed, each with its reason.' },
    { key: 'care', label: 'Take care', ic: 'risk', tone: 'risk', kinds: ['caution'], hint: 'Rules and risks to keep in mind while building.' },
    { key: 'tickets', label: 'Tickets', ic: 'ticket', tone: 'build', kinds: [], hint: 'The work that builds what was decided here.' },
    { key: 'discussed', label: 'Discussed', ic: 'talk', tone: 'talk', kinds: ['discussed'], hint: 'Talked through; no action needed.' },
    { key: 'dropped', label: 'Dropped', ic: 'drop', tone: 'idle', kinds: ['dropped'], hint: 'Decided not to do, with the reason.' },
  ];
  const TICKET = { planned: { label: 'Ready', tone: 'idle', step: 0 }, 'in-progress': { label: 'In progress', tone: 'build', step: 1 }, blocked: { label: 'Blocked', tone: 'risk', step: 1 }, done: { label: 'Done', tone: 'ok', step: 2 }, dropped: { label: 'Dropped', tone: 'idle', step: -1 }, 'to-discuss': { label: 'Not ready', tone: 'idle', step: 0 }, discussing: { label: 'Not ready', tone: 'idle', step: 0 }, decided: { label: 'Not ready', tone: 'idle', step: 0 } };
  const GROUP = {
    agent: { ic: 'layers', title: 'Agents', one: 'Agent', hint: 'Subagents Claude can hand work to, each with its own instructions and tool limits.', tone: 'talk' },
    skill: { ic: 'idea', title: 'Skills', one: 'Skill', hint: 'Instructions Claude follows: by slash command, on its own when the task matches, or both.', tone: 'accent' },
    hook: { ic: 'tools', title: 'Hooks', one: 'Hook', hint: 'Scripts Claude Code runs on events. Unlike instructions, they cannot be forgotten.', tone: 'build' },
  };
  const LABELS = { what: 'What this is', why: 'Why', expected: 'What we expect', discussed: 'What we discussed', options: 'Options on the table', pending: 'Still pending', built: "What's built", risk: 'What goes wrong if we forget', next: 'Next step', how: 'How it works', see: 'See also' };
  const LABEL_TONE = { why: 'ok', expected: 'build', options: 'accent', pending: 'ask', built: 'build', risk: 'risk', next: 'accent', discussed: 'talk' };
  const NEXT = {
    open: '<b>Waiting for an answer.</b> When it is decided, change <code>open</code> → <code>decided</code> on this line in the file and add a <code>Why:</code> line.',
    suggestion: '<b>Waiting for a yes or no.</b> Accept: change <code>suggestion</code> → <code>decided</code>. Reject: → <code>dropped</code> with a <code>Why:</code> line.',
    caution: '<b>Keep this in mind while building.</b> Tickets that touch it should mention it in their notes.',
  };

  // ---------- helpers ----------
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(`thinkmap:${k}`); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(`thinkmap:${k}`, JSON.stringify(v)); } catch { /* storage unavailable */ } },
  };
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const fmtDate = (d) => { if (!d) return ''; const [y, m, dd] = d.split('-'); return `${Number(dd)} ${MONTHS[Number(m) - 1]}${y !== String(new Date().getFullYear()) ? ` ${y}` : ''}`; };
  const plural = (n, one, many) => `${n} ${n === 1 ? one : many || `${one}s`}`;
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const href = (...p) => `#/${p.map((x) => encodeURIComponent(x)).join('/')}`;
  const route = () => location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map((x) => { try { return decodeURIComponent(x); } catch { return x; } });

  const state = { g: null, byId: new Map(), q: '', hit: 0, flat: [], expanded: new Set(store.get('expanded', [])), pos: new Map(), files: new Map(), fmode: store.get('fmode', 'rendered'), revealId: null, lastToggled: null, lastRoute: null };

  // ---------- data ----------
  const nodesOf = (t) => (state.g?.nodes || []).filter((n) => n.type === t);
  const project = () => nodesOf('project')[0];
  const kidsOf = (n) => (n.children || []).map((id) => state.byId.get(id)).filter(Boolean);
  const pointsOf = (f) => kidsOf(f).filter((c) => c.type === 'point');
  const ticketsOf = (f) => kidsOf(f).filter((c) => c.type === 'ticket');
  const featuresOf = (ph) => nodesOf('feature').filter((f) => f.phase === ph.id);
  const topicOf = (n) => { let p = n; while (p && p.type !== 'feature') p = state.byId.get(p.parent); return p; };
  const phaseNum = (ph) => esc(String(ph.id).replace(/^P/, ''));
  function counts(features) {
    const c = { open: 0, suggestion: 0, caution: 0, decided: 0, discussed: 0, dropped: 0, work: 0, done: 0 };
    for (const f of features) {
      for (const p of pointsOf(f)) c[p.kind] = (c[p.kind] || 0) + 1;
      for (const t of ticketsOf(f)) { c.work++; if (t.status === 'done') c.done++; }
    }
    return c;
  }
  const countsOf = (n) => counts(n.type === 'feature' ? [n] : n.type === 'phase' ? featuresOf(n) : nodesOf('feature'));
  const asks = (c) => c.open + c.suggestion;
  const progressOf = (n) => { const p = n.progress || { points: { total: 0, settled: 0 }, tickets: { total: 0, done: 0 } }; return { done: p.points.settled + p.tickets.done, total: p.points.total + p.tickets.total, p }; };
  // One plain-word status for a project, phase or topic.
  function stage(n) {
    const c = countsOf(n); const { p } = progressOf(n);
    if (!p.points.total && !p.tickets.total) return { key: 'empty', label: 'Not planned yet', tone: 'idle' };
    if (p.tickets.total && p.tickets.done === p.tickets.total && p.points.settled === p.points.total) return { key: 'done', label: 'Done', tone: 'ok' };
    if (asks(c)) return { key: 'decide', label: `${asks(c)} to decide`, tone: 'ask' };
    if (p.tickets.total) return { key: 'build', label: `Building · ${p.tickets.done}/${p.tickets.total}`, tone: 'build' };
    return { key: 'ready', label: 'Ready for tickets', tone: 'build' };
  }
  const currentPhase = () => nodesOf('phase').find((ph) => !['done', 'empty'].includes(stage(ph).key));
  function linkTo(n) {
    if (!n) return '#/';
    if (n.type === 'phase') return href('p', n.id);
    if (n.type === 'feature') return href('t', n.id);
    if (n.type === 'point') return href('n', n.id);
    if (n.type === 'ticket') return href('k', n.id);
    if (n.type === 'tool') return href('tooling', n.id);
    return '#/';
  }
  const kindOf = (p) => KIND[p.kind] || KIND.dropped;
  const toneOfNode = (n) => (n.type === 'point' ? kindOf(n).tone : n.type === 'ticket' ? (TICKET[n.status] || TICKET.planned).tone : n.type === 'tool' ? GROUP[n.group].tone : stage(n).tone);
  const iconOfNode = (n) => (n.type === 'point' ? kindOf(n).ic : n.type === 'ticket' ? 'ticket' : n.type === 'tool' ? GROUP[n.group].ic : 'layers');

  // ---------- building blocks ----------
  const ring = (done, total, tone, cls = '') => {
    const v = pct(done, total); const C = 2 * Math.PI * 15.5;
    return `<span class="ring ${cls} t-${tone}" title="${done} of ${total} settled or built"><svg viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15.5" fill="none" stroke-width="3.2"/><circle class="fg" cx="18" cy="18" r="15.5" fill="none" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C * (1 - v / 100)).toFixed(2)}"/></svg><b>${total ? `${v}%` : '–'}</b></span>`;
  };
  const pill = (label, tone, ic) => `<span class="pill t-${tone}">${ic ? icon(ic) : '<i></i>'}${esc(label)}</span>`;
  const dotic = (ic, tone) => `<span class="dotic t-${tone}">${icon(ic)}</span>`;
  const sechead = (title, n, sub, more) => `<div class="sechead"><div><h2 class="sec">${esc(title)}${n !== undefined && n !== null ? ` <span class="n">${n}</span>` : ''}</h2>${sub ? `<p>${sub}</p>` : ''}</div>${more || ''}</div>`;
  const noteSnippet = (n) => { const s = noteSections(n.notes); const w = s.find((x) => x.key === 'what') || s[0]; return w ? w.text.split('\n')[0] : ''; };
  const inlineMd = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '$1');
  // A row in a list, for any node.
  function item(n, opts = {}) {
    if (!n) return '';
    const tone = toneOfNode(n);
    let sub = ''; let right = '';
    if (n.type === 'point') { sub = opts.topic ? esc(topicOf(n)?.title || '') : inlineMd(noteSnippet(n)); right = esc([fmtDate(n.date), n.from].filter(Boolean).join(' · ')); }
    else if (n.type === 'ticket') { sub = esc([n.id, n.owner || 'no owner yet', n.checklist?.total ? `${n.checklist.done}/${n.checklist.total} criteria met` : ''].filter(Boolean).join(' · ')); right = pill((TICKET[n.status] || TICKET.planned).label, tone); }
    else if (n.type === 'tool') sub = esc(n.description || '');
    else sub = esc(stage(n).label);
    return `<a class="item ${n.kind === 'dropped' ? 'dropped' : ''}" href="${linkTo(n)}">${dotic(iconOfNode(n), tone)}<span><div class="t">${inlineMd(n.title || n.name)}</div>${sub ? `<div class="s">${sub}</div>` : ''}</span><span class="r">${right}${icon('chev')}</span></a>`;
  }
  const itemList = (list, opts) => `<div class="card list">${list.map((n) => item(n, opts)).join('')}</div>`;
  const idList = (ids) => itemList(ids.map((id) => state.byId.get(id)).filter(Boolean));
  const editorLink = (n) => (state.g.root && n.file ? `vscode://file/${encodeURI(`${state.g.root}/${n.file}`)}:${n.line || 1}` : null);
  function actions(n) {
    const ed = editorLink(n);
    return `<div class="actions">
      ${ed ? `<a href="${ed}" title="Open the file in VS Code at this line">${icon('edit')}Open in editor</a>` : ''}
      ${window.__PLAN__ || !n.file ? '' : `<a href="${href('file', n.id)}">${icon('file')}View the file</a>`}
      <button data-copy="${esc(n.id)}">${icon('copy')}Copy ID</button>
      <button data-reveal="${esc(n.id)}">${icon('map')}Show on map</button>
    </div>`;
  }
  const commitsHtml = (list) => `<div class="card doc">${list.map((c) => `<p><code>${esc(c.hash)}</code> ${esc(c.subject)} <span class="muted">· ${esc(c.author)} · ${esc(c.date)}</span></p>`).join('')}</div>`;

  // ---------- markdown ----------
  function md(text) {
    const inline = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener" style="color:var(--accent)">$1</a>');
    let out = ''; let inList = false; let inCode = false; let buf = [];
    const closeList = () => { if (inList) { out += '</ul>'; inList = false; } };
    for (const raw of String(text || '').split('\n')) {
      if (/^\s*(```|~~~)/.test(raw)) { if (inCode) { out += `<pre>${esc(buf.join('\n'))}</pre>`; buf = []; inCode = false; } else { closeList(); inCode = true; } continue; }
      if (inCode) { buf.push(raw); continue; }
      const cb = /^\s*[-*]\s+\[([ xX])\]\s+(.*)$/.exec(raw); const li = /^\s*[-*]\s+(.*)$/.exec(raw);
      if (cb || li) { if (!inList) { out += '<ul>'; inList = true; } out += cb ? `<li class="cb"><span class="box ${cb[1] === ' ' ? '' : 'x'}">${cb[1] === ' ' ? '' : icon('check')}</span><span>${inline(cb[2])}</span></li>` : `<li>${inline(li[1])}</li>`; continue; }
      closeList();
      const h = /^(#{1,6})\s+(.*)$/.exec(raw); const q = /^\s*>\s?(.*)$/.exec(raw);
      if (h) { const lvl = h[1].length; out += lvl === 1 ? `<h2>${inline(h[2])}</h2>` : lvl === 2 ? `<h3>${inline(h[2])}</h3>` : `<h4>${inline(h[2])}</h4>`; }
      else if (q) out += `<blockquote>${inline(q[1])}</blockquote>`; else if (raw.trim()) out += `<p>${inline(raw)}</p>`;
    }
    if (inCode) out += `<pre>${esc(buf.join('\n'))}</pre>`;
    closeList();
    return out;
  }
  function noteSections(notes) {
    const out = [];
    for (const line of notes || []) {
      const m = /^([A-Za-z][A-Za-z ]{0,14}):\s*(.*)$/.exec(line);
      const key = m && LABELS[m[1].trim().toLowerCase()] ? m[1].trim().toLowerCase() : null;
      if (key) out.push({ key, text: m[2] });
      else if (out.length) out[out.length - 1].text += `\n${line}`;
      else out.push({ key: null, text: line });
    }
    return out;
  }
  // Points and the generated "## Tickets" list are shown as their own sections, not as intro text.
  const aboutText = (n) => (n.sections || []).filter((s) => s.text && !/^(points|tickets)$/i.test(s.heading || ''));
  const firstLine = (n) => { const a = aboutText(n)[0]; return a ? a.text.split('\n\n')[0].replace(/\n/g, ' ').trim() : ''; };
  const intro = (n) => (firstLine(n) ? `<div class="lede">${inlineMd(firstLine(n))}</div>` : '');

  // ---------- pages ----------
  function events() {
    const ev = [];
    for (const n of state.g.nodes) {
      if (n.type === 'point' && n.date) ev.push({ date: n.date, n });
      if (n.type === 'ticket' && n.updated && (n.status === 'done' || n.status === 'in-progress')) ev.push({ date: n.updated, n });
    }
    return ev.sort((a, b) => b.date.localeCompare(a.date));
  }

  function homePage() {
    const p = project();
    if (!p) return emptyPage();
    const phases = nodesOf('phase');
    const c = counts(nodesOf('feature'));
    const prog = progressOf(p);
    const ask = nodesOf('point').filter((x) => x.kind === 'open' || x.kind === 'suggestion');
    const cur = currentPhase();
    const tools = state.g.tooling?.items?.length || 0;
    const { errors = 0, warnings = 0 } = state.g.stats || {};
    const step = (ph) => {
      const s = stage(ph); const pr = progressOf(ph); const fs = featuresOf(ph); const pc = countsOf(ph);
      const cls = s.key === 'done' ? 'done' : s.key === 'empty' ? 'todo' : ph === cur ? 'now' : '';
      const sub = fs.length ? [plural(fs.length, 'topic'), pc.decided && `${pc.decided} decided`, pr.p.tickets.total && `${pr.p.tickets.done}/${pr.p.tickets.total} tickets done`].filter(Boolean).join(' · ') : 'Nothing planned in this phase yet';
      return `<li class="${cls}"><span class="node">${s.key === 'done' ? icon('check') : phaseNum(ph)}</span>
        <a class="card stepcard" href="${linkTo(ph)}"><div>
          <div class="top">${ph === cur ? '<span class="here">You are here</span>' : ''}<h3>${esc(ph.title)}</h3>${pill(s.label, s.tone)}</div>
          ${firstLine(ph) ? `<p>${inlineMd(firstLine(ph))}</p>` : ''}
          <div class="sub">${sub}</div>
        </div>${pr.total ? ring(pr.done, pr.total, s.tone) : ''}</a></li>`;
    };
    const recent = events().slice(0, 6);
    const attention = ask.length
      ? `<div class="attention"><span class="big">${ask.length}</span><div style="min-width:0"><h3>${ask.length === 1 ? 'One decision is' : `${ask.length} decisions are`} waiting for you</h3><ul>${ask.slice(0, 3).map((n) => `<li><a href="${linkTo(n)}">${icon(kindOf(n).ic)}<span>${inlineMd(n.title)}</span><em>· ${esc(topicOf(n)?.title || '')}</em></a></li>`).join('')}</ul></div><a class="btn" href="#/inbox">Review all ${icon('right')}</a></div>`
      : `<div class="allclear">${icon('check')}<span><b style="color:var(--text)">Nothing is waiting for you.</b> Every question in the plan has an answer.</span></div>`;
    const mini = (to, ic, tone, t, s) => `<a class="card mini" href="${to}">${dotic(ic, tone)}<span><div class="t">${t}</div><div class="s">${s}</div></span><span class="go">${icon('chev')}</span></a>`;
    return `
      <section class="hero"><div>
        <div class="eyebrow">${icon('layers')}Project</div>
        <h1>${esc(p.title)}</h1>
        ${intro(p)}
        <div class="facts"><span><b>${phases.length}</b> phases</span><span><b>${nodesOf('feature').length}</b> topics</span><span><b>${c.decided}</b> decisions</span><span><b>${c.done}/${c.work}</b> tickets done</span></div>
      </div><div class="side">${ring(prog.done, prog.total, 'accent', 'big')}<span>overall progress</span></div></section>
      ${attention}
      ${sechead('Roadmap', phases.length, 'Your project, phase by phase. Open one to see its topics.')}
      ${phases.length ? `<ol class="road">${phases.map(step).join('')}</ol>` : '<div class="card empty"><h3>No phases yet</h3><p>Add one with <code>thinkmap phase P1 &lt;slug&gt;</code>.</p></div>'}
      <div class="duo">
        <div>${sechead('Recent activity', null, 'What was decided, asked or built lately.')}<div class="card feed">${recent.length ? recent.map((e) => `<a href="${linkTo(e.n)}">${dotic(iconOfNode(e.n), toneOfNode(e.n))}<span class="t">${inlineMd(e.n.title)}</span><span class="d">${fmtDate(e.date)}</span></a>`).join('') : '<p class="muted" style="padding:14px">Nothing dated yet.</p>'}</div></div>
        <div>${sechead('Also in this project', null, 'Reference, when you need it.')}<div class="minis">
          ${c.caution ? mini('#/care', 'risk', 'risk', `${plural(c.caution, 'thing', 'things')} to take care of`, 'Rules and risks to remember while building') : ''}
          ${mini('#/tooling', 'tools', 'accent', 'Claude Code tooling', tools ? plural(tools, 'agent, skill or hook', 'agents, skills and hooks') : 'None in this project')}
          ${errors || warnings ? mini('#/issues', 'warn', errors ? 'risk' : 'idle', errors ? plural(errors, 'format error') : plural(warnings, 'format warning'), errors ? 'Some plan files break the format' : 'Small fixes; the plan still reads fine') : ''}
        </div></div>
      </div>`;
  }

  function emptyPage() {
    const g = state.g;
    const errs = (g.issues || []).filter((i) => i.level === 'error').slice(0, 5);
    const cli = g.app?.cli || 'npx github:dsngeu/ThinkMap';
    return `<section class="hero"><div><div class="eyebrow">${icon('layers')}Thinkmap</div><h1>No plan found</h1>
      <div class="lede">Thinkmap needs a <code>project.md</code> with <code>type: project</code> in <code>${esc(g.planDir && g.planDir !== '.' ? g.planDir : g.root || 'docs/plan')}</code>.</div></div></section>
      ${sechead('New project', null, 'Create the folder from the template. This page updates by itself afterwards.')}<pre>${esc(cli)} init --name "Your Project"</pre>
      ${sechead('Plan lives elsewhere', null, 'Restart with its path:')}<pre>${esc(cli)} serve path/to/plan --open</pre>
      ${errs.length ? `${sechead('Format errors', errs.length)}<div class="card">${errs.map((i) => `<div class="issue"><code>${esc(i.file)}</code> ${esc(i.message)}</div>`).join('')}</div>` : ''}`;
  }

  function phasePage(ph) {
    const fs = featuresOf(ph);
    const s = stage(ph); const pr = progressOf(ph);
    const tks = fs.flatMap(ticketsOf);
    const card = (f) => {
      const fsg = stage(f); const fp = progressOf(f); const fc = countsOf(f);
      const bits = [fc.decided && `${fc.decided} decided`, fc.work && `${fc.done}/${fc.work} tickets`].filter(Boolean).join(' · ');
      return `<a class="card tcard ${asks(fc) ? 'needs' : ''}" href="${linkTo(f)}"><div class="row1"><h3>${esc(f.title)}</h3>${fp.total ? ring(fp.done, fp.total, fsg.tone, 'sm') : ''}</div>
        ${firstLine(f) ? `<p class="desc">${inlineMd(firstLine(f))}</p>` : ''}
        <div class="foot">${pill(fsg.label, fsg.tone)}<span>${bits || 'Empty'}</span></div></a>`;
    };
    return `<div class="phasehead"><div>
        <div class="eyebrow">${icon('layers')}Phase ${phaseNum(ph)}${ph === currentPhase() ? ' · you are here' : ''}</div>
        <h1>${esc(ph.title)}</h1>${intro(ph)}
        <div class="stats">
          <div class="stat t-${s.tone}"><b>${esc(s.label)}</b><span>status</span></div>
          <div class="stat"><b>${fs.length}</b><span>topics</span></div>
          <div class="stat t-ok"><b>${pct(pr.p.points.settled, pr.p.points.total)}%</b><span>decided</span></div>
          <div class="stat t-build"><b>${pr.p.tickets.done}/${pr.p.tickets.total}</b><span>tickets done</span></div>
        </div></div>${pr.total ? ring(pr.done, pr.total, s.tone, 'big') : ''}</div>
      ${sechead('Topics', fs.length, 'Each topic holds one subject: its questions, decisions, cautions and tickets.')}
      ${fs.length ? `<div class="grid">${fs.map(card).join('')}</div>` : '<div class="card empty"><h3>No topics yet</h3><p>Add a topic file <code>F01-slug.md</code> to this phase folder.</p></div>'}
      ${tks.length ? `${sechead('All tickets in this phase', tks.length, '')}${itemList(tks)}` : ''}
      ${actions(ph)}`;
  }

  function topicPage(f, tabKey) {
    const pts = pointsOf(f); const tks = ticketsOf(f);
    const s = stage(f); const pr = progressOf(f);
    const n = Object.fromEntries(TABS.map((t) => [t.key, t.key === 'tickets' ? tks.length : pts.filter((p) => t.kinds.includes(p.kind)).length]));
    const shown = TABS.filter((t) => n[t.key] || ['decide', 'decided'].includes(t.key));
    const tab = shown.find((t) => t.key === tabKey) || (n.decide ? shown[0] : shown.find((t) => n[t.key]) || shown[0]);
    const list = tab.key === 'tickets' ? tks : pts.filter((p) => tab.kinds.includes(p.kind));
    const body = list.length ? itemList(list)
      : `<div class="card empty">${icon('check')}<h3>${tab.key === 'decide' ? 'Nothing left to decide' : 'Nothing here yet'}</h3><p>${tab.key === 'decide' ? 'Every question in this topic has an answer.' : esc(tab.hint)}</p></div>`;
    return `<div class="phasehead"><div>
        <div class="eyebrow">${icon('layers')}Topic · ${esc(f.id)}</div>
        <h1>${esc(f.title)}</h1>${intro(f)}
        <div class="meta">${pill(s.label, s.tone)}<span>${pct(pr.p.points.settled, pr.p.points.total)}% decided</span>${pr.p.tickets.total ? `<span>${pr.p.tickets.done}/${pr.p.tickets.total} tickets done</span>` : ''}<span>updated ${fmtDate(f.updated)}</span></div>
      </div>${pr.total ? ring(pr.done, pr.total, s.tone, 'big') : ''}</div>
      <nav class="tabs" aria-label="Notes in this topic">${shown.map((t) => `<a class="${t === tab ? 'on' : ''} t-${t.tone}" href="${href('t', f.id, t.key)}">${icon(t.ic)}${t.label}<span class="n">${n[t.key]}</span></a>`).join('')}</nav>
      <p class="tabhint">${esc(tab.hint)}</p>
      ${body}
      ${f.dependsOn?.length ? `${sechead('Depends on', f.dependsOn.length, '')}${idList(f.dependsOn)}` : ''}
      ${actions(f)}`;
  }

  function notePage(p) {
    const k = kindOf(p); const f = topicOf(p);
    const secs = noteSections(p.notes);
    const title = (s) => (s.key === 'why' ? (p.kind === 'dropped' ? 'Why we dropped it' : p.kind === 'decided' ? 'Why we decided this' : 'Why') : s.key ? LABELS[s.key] : (p.kind === 'suggestion' ? 'The idea' : 'Details'));
    const blocks = secs.length
      ? secs.map((s) => `<div class="card block t-${s.key === 'what' || !s.key ? k.tone : LABEL_TONE[s.key] || k.tone}"><div class="lbl">${title(s)}</div>${md(s.text)}</div>`).join('')
      : '<div class="card block t-idle"><div class="lbl">No details yet</div><p class="muted">Add indented lines under this point in the file: <code>&gt; What: …</code>, <code>&gt; Why: …</code></p></div>';
    const sibs = f ? pointsOf(f).filter((x) => kindOf(x).tab === k.tab) : [];
    const i = sibs.indexOf(p); const prev = sibs[i - 1]; const next = sibs[i + 1];
    const tab = TABS.find((t) => t.key === k.tab);
    return `<article class="reader">
      <div class="eyebrow">${pill(k.one, k.tone, k.ic)}<span>${esc(p.id)}</span></div>
      <h1 style="margin-top:14px">${inlineMd(p.title)}</h1>
      <div class="meta">${p.date ? `<span>${icon('clock')} ${fmtDate(p.date)}</span>` : ''}${p.from ? `<span>raised by ${esc(p.from)}</span>` : ''}${f ? `<span>in <a href="${href('t', f.id, k.tab)}">${esc(f.title)}</a></span>` : ''}${sibs.length > 1 ? `<span>${i + 1} of ${sibs.length} ${esc(tab.label.toLowerCase())}</span>` : ''}</div>
      <div class="blocks">${blocks}</div>
      ${NEXT[p.kind] ? `<div class="callout t-${k.tone}">${icon(k.ic)}<span>${NEXT[p.kind]}</span></div>` : ''}
      ${p.implementedBy?.length ? `${sechead('Built by', p.implementedBy.length, 'The tickets that deliver this.')}${idList(p.implementedBy)}` : ''}
      ${p.commits?.length ? `${sechead('Commits mentioning this', p.commits.length, '')}${commitsHtml(p.commits)}` : ''}
      ${actions(p)}
      ${prev || next ? `<nav class="pager">${prev ? `<a class="card prev" href="${linkTo(prev)}"><div class="k">${icon('left')}Previous</div><div class="t">${inlineMd(prev.title)}</div></a>` : '<span></span>'}${next ? `<a class="card next" href="${linkTo(next)}"><div class="k">Next${icon('right')}</div><div class="t">${inlineMd(next.title)}</div></a>` : ''}</nav>` : ''}
    </article>`;
  }

  function ticketPage(n) {
    const s = TICKET[n.status] || TICKET.planned;
    const part = (name) => (n.sections || []).find((x) => new RegExp(`^${name}$`, 'i').test(x.heading || ''));
    const goal = part('goal'); const ac = part('acceptance criteria'); const oos = part('out of scope'); const notes = part('notes');
    const other = (n.sections || []).filter((x) => x.text && x.heading && !/^(goal|acceptance criteria|out of scope|notes|handoff log)$/i.test(x.heading));
    const waiting = n.dependsOn.filter((d) => state.byId.get(d)?.status !== 'done');
    const labels = ['Ready', n.status === 'blocked' ? 'Blocked' : 'In progress', 'Done'];
    const isDone = n.status === 'done';
    const stepper = s.step < 0 ? '' : `<div class="stepper t-${s.tone}">${labels.map((label, i) => {
      const cls = i < s.step || (isDone && i === s.step) ? 'done' : i === s.step ? 'cur' : '';
      return `${i ? `<span class="ln ${i <= s.step ? 'done' : ''}"></span>` : ''}<span class="st ${cls}"><i>${cls === 'done' ? icon('check') : i + 1}</i>${label}</span>`;
    }).join('')}</div>`;
    const doc = (title, text) => (text ? `${sechead(title, null, '')}<div class="card doc">${md(text)}</div>` : '');
    const f = topicOf(n);
    return `<article class="reader">
      <div class="eyebrow">${pill(`Ticket · ${s.label}`, s.tone, 'ticket')}<span>${esc(n.id)}</span></div>
      <h1 style="margin-top:14px">${inlineMd(n.title)}</h1>
      ${goal?.text ? `<div class="lede">${md(goal.text)}</div>` : ''}
      ${stepper}
      <div class="kv"><div><span>Owner</span><b>${esc(n.owner || 'nobody yet')}</b></div><div><span>Updated</span><b>${fmtDate(n.updated)}</b></div>${n.checklist?.total ? `<div><span>Acceptance criteria</span><b>${n.checklist.done} of ${n.checklist.total} met</b></div>` : ''}${f ? `<div><span>Topic</span><b><a href="${linkTo(f)}">${esc(f.title)}</a></b></div>` : ''}</div>
      ${n.status === 'blocked' || waiting.length ? `<div class="callout t-risk">${icon('risk')}<span><b>Waiting on</b> ${waiting.length ? waiting.map((d) => `<a href="${linkTo(state.byId.get(d))}">${esc(d)}</a>`).join(', ') : 'see the notes'}</span></div>` : ''}
      ${doc('Acceptance criteria', ac?.text)}
      ${n.implements?.length ? `${sechead('Delivers these decisions', n.implements.length, '')}${idList(n.implements)}` : ''}
      ${n.dependsOn?.length ? `${sechead('Depends on', n.dependsOn.length, '')}${idList(n.dependsOn)}` : ''}
      ${n.blocks?.length ? `${sechead('Blocks', n.blocks.length, '')}${idList(n.blocks)}` : ''}
      ${doc('Out of scope', oos?.text)}${doc('Notes', notes?.text)}${other.map((x) => doc(x.heading, x.text)).join('')}
      ${n.code?.length ? `${sechead('Code', n.code.length, '')}<div class="card doc">${n.code.map((c) => `<p><code>${esc(c.path)}</code> <span class="muted">${c.exists ? '· exists' : '· not created yet'}</span></p>`).join('')}</div>` : ''}
      ${n.commits?.length ? `${sechead('Commits', n.commits.length, '')}${commitsHtml(n.commits)}` : ''}
      ${sechead('Handoff log', n.handoff?.length || 0, 'Each session working on this ticket adds a line.')}
      ${n.handoff?.length ? `<div class="card doc" style="padding:18px 22px"><div class="log">${n.handoff.map((h) => `<div>${esc(h)}</div>`).join('')}</div></div>` : '<p class="muted">No entries yet.</p>'}
      ${actions(n)}
    </article>`;
  }

  // Lists across the whole project, grouped by topic.
  function groupedPage(kinds, eyebrow, title, lede, tone, ic, emptyText) {
    const list = nodesOf('point').filter((x) => kinds.includes(x.kind));
    const byTopic = new Map();
    for (const n of list) { const f = topicOf(n); if (!byTopic.has(f)) byTopic.set(f, []); byTopic.get(f).push(n); }

        content.appendChild(el);
      } else { el.className = fresh.className; el.innerHTML = fresh.innerHTML; el.style.width = fresh.style.width; }
      el.dataset.parent = r.parentId || '';
      byId.set(r.n.id, el);
    }
    const h = new Map([...byId].map(([id, el]) => [id, el.offsetHeight]));
    const colX = []; let x = PAD;
    const depthType = ['project', 'phase', 'feature', 'point'];
    for (let d = 0; d < 5; d++) { colX[d] = x; x += (WIDTH[depthType[Math.min(d, 3)]] || 340) + GAP_X; }
    const pos = new Map();
    let y = PAD;
    const rowById = new Map(rows.map((r) => [r.n.id, r]));
    const place = (id) => {
      const r = rowById.get(id); const hh = h.get(id) || 40;
      if (!r.kidIds.length) { pos.set(id, { x: colX[r.depth], y, h: hh }); y += hh + GAP_Y; return; }
      for (const k of r.kidIds) place(k);
      const first = pos.get(r.kidIds[0]); const last = pos.get(r.kidIds[r.kidIds.length - 1]);
      pos.set(id, { x: colX[r.depth], y: (first.y + last.y + last.h) / 2 - hh / 2, h: hh });
      if (r.kidIds.length > 1) y += GAP_Y;
    };
    place(rows[0].n.id);
    const stageEl = $('#stage');
    const treeH = y + PAD;
    const offset = Math.max(0, (stageEl.clientHeight - treeH) / 2);
    const maxX = Math.max(...[...pos.entries()].map(([id, p]) => p.x + (byId.get(id)?.offsetWidth || 0))) + PAD;
    const canvasH = Math.max(stageEl.clientHeight, treeH + offset); const canvasW = Math.max(stageEl.clientWidth, maxX);
    $('#canvas').style.width = `${canvasW}px`; $('#canvas').style.height = `${canvasH}px`;
    const svg = $('#links'); svg.setAttribute('width', canvasW); svg.setAttribute('height', canvasH);
    requestAnimationFrame(() => {
      for (const [id, p] of pos) { const el = byId.get(id); el.style.left = `${p.x}px`; el.style.top = `${p.y + offset}px`; el.classList.remove('ghost'); }
      state.pos = new Map([...pos].map(([id, p]) => [id, { x: p.x, y: p.y + offset, h: p.h }]));
      const t0 = performance.now();
      cancelAnimationFrame(animTimer);
      const tick = () => { drawLinks(rows, byId); if (performance.now() - t0 < 420) animTimer = requestAnimationFrame(tick); };
      tick();
      if (state.revealId) {
        const rid = state.revealId;
        setTimeout(() => document.querySelector(`[data-card="${CSS.escape(rid)}"]`)?.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' }), 420);
        setTimeout(() => { if (state.revealId === rid) { state.revealId = null; byId.get(rid)?.classList.remove('sel'); } }, 2600);
      } else {
        const last = rows.find((r) => r.open && r.n.id === state.lastToggled);
        if (last && last.kidIds.length) {
          const lastK = byId.get(last.kidIds[last.kidIds.length - 1]); const first = byId.get(last.kidIds[0]);
          const top = pos.get(last.kidIds[0]).y + offset; const bottom = pos.get(last.kidIds[last.kidIds.length - 1]).y + offset + (lastK?.offsetHeight || 0);
          const right = pos.get(last.kidIds[0]).x + (first?.offsetWidth || 0) + PAD;
          const view = { top: stageEl.scrollTop, bottom: stageEl.scrollTop + stageEl.clientHeight, right: stageEl.scrollLeft + stageEl.clientWidth };
          const opts = { behavior: 'smooth' };
          if (bottom - top < stageEl.clientHeight) { if (top < view.top || bottom > view.bottom) opts.top = Math.max(0, (top + bottom) / 2 - stageEl.clientHeight / 2); }
          else if (top < view.top || top > view.bottom) opts.top = Math.max(0, top - 40);
          if (right > view.right) opts.left = Math.max(0, right - stageEl.clientWidth);
          if (opts.top !== undefined || opts.left !== undefined) stageEl.scrollTo(opts);
        }
      }
      state.lastToggled = null;
    });
  }
  function drawLinks(rows, byId) {
    const canvas = $('#canvas').getBoundingClientRect();
    const rect = (el) => { const r = el.getBoundingClientRect(); return { x1: r.left - canvas.left, y: r.top - canvas.top + r.height / 2, x2: r.right - canvas.left }; };
    const paths = [];
    for (const r of rows) {
      if (!r.parentId) continue;
      const pe = byId.get(r.parentId); const ce = byId.get(r.n.id);
      if (!pe || !ce) continue;
      const p = rect(pe); const c = rect(ce); const mx = (p.x2 + c.x1) / 2;
      paths.push(`<path class="${ce.classList.contains('ghost') ? 'ghost' : ''}" d="M${p.x2},${p.y} C${mx},${p.y} ${mx},${c.y} ${c.x1},${c.y}"/>`);
    }
    $('#links').innerHTML = paths.join('');
  }
  function toggle(id) {
    if (state.expanded.has(id)) {
      const n = state.byId.get(id);
      const drop = (x) => { state.expanded.delete(x.id); for (const k of mkids(x)) if (state.expanded.has(k.id)) drop(k); };
      if (n) drop(n); else state.expanded.delete(id);
    } else state.expanded.add(id);
    state.lastToggled = id;
    store.set('expanded', [...state.expanded]);
    renderMap();
  }
  function reveal(id) {
    let cur = state.byId.get(id);
    if (!cur) return;
    cur = state.byId.get(cur.parent);
    while (cur) { state.expanded.add(cur.id); cur = state.byId.get(cur.parent); }
    store.set('expanded', [...state.expanded]);
    state.revealId = id;
    if (route()[0] === 'map') renderMap(); else location.hash = '#/map';
  }
  function setLive(mode, text) { const el = $('#live'); el.className = `live ${mode}`; el.title = text; }

  // ---------- events ----------
  $('#markIc').innerHTML = icon('logo'); $('#searchIc').innerHTML = icon('search'); $('#mapIc').innerHTML = icon('map'); $('#palIc').innerHTML = icon('search');
  document.addEventListener('click', (e) => {
    const t = e.target;
    if (!t.closest('#updbox') && !t.closest('#updBtn')) $('#updbox').hidden = true;
    if (t.closest('#updBtn')) { $('#updbox').hidden = !$('#updbox').hidden; return; }
    if (t.closest('#searchBtn')) { openPalette(); return; }
    if (t.id === 'palette') { closePalette(); return; }
    const go = t.closest('[data-go]');
    if (go) { e.stopPropagation(); location.hash = go.dataset.go; return; }
    const card = t.closest('[data-card]');
    if (card) { const n = state.byId.get(card.dataset.card); if (n && (n.type === 'point' || n.type === 'ticket')) location.hash = linkTo(n); else toggle(card.dataset.card); return; }
    const ca = t.closest('[data-cat]');
    if (ca) { if (!ca.disabled) catAction(ca.dataset.cat, ca.dataset.name, ca); return; }
    const cp = t.closest('[data-copy]');
    if (cp) { const orig = cp.innerHTML; navigator.clipboard?.writeText(cp.dataset.copy).then(() => { cp.innerHTML = `${icon('check')}Copied`; setTimeout(() => { cp.innerHTML = orig; }, 1200); }); return; }
    const rv = t.closest('[data-reveal]');
    if (rv) { reveal(rv.dataset.reveal); return; }
    const fm = t.closest('[data-fmode]');
    if (fm) { state.fmode = fm.dataset.fmode; store.set('fmode', state.fmode); renderPage(false); requestAnimationFrame(() => $('#page [data-hl]')?.scrollIntoView({ block: 'center' })); }
  });
  $('#res').addEventListener('mousemove', (e) => { const h = e.target.closest('[data-i]'); if (h && Number(h.dataset.i) !== state.hit) { state.hit = Number(h.dataset.i); $('#res .hit.on')?.classList.remove('on'); h.classList.add('on'); } });
  $('#collapseBtn').addEventListener('click', () => { state.expanded.clear(); store.set('expanded', []); renderMap(); });
  $('#q').addEventListener('input', (e) => { state.q = e.target.value.trim().toLowerCase(); state.hit = 0; renderPalette(); });
  document.addEventListener('keydown', (e) => {
    const pal = !$('#palette').hidden;
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (pal) closePalette(); else openPalette(); return; }
    if (pal) {
      if (e.key === 'Escape') { e.preventDefault(); closePalette(); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); state.hit = Math.min(state.hit + 1, state.flat.length - 1); renderPalette(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); state.hit = Math.max(state.hit - 1, 0); renderPalette(); }
      else if (e.key === 'Enter') { const n = state.flat[state.hit]; if (n) { e.preventDefault(); location.hash = linkTo(n); closePalette(); } }
      return;
    }
    if (e.target.matches('input, textarea, select')) return;
    if (e.key === '/') { e.preventDefault(); openPalette(); return; }
    if (e.key === 'Escape') { $('#updbox').hidden = true; return; }
    // On a note page, ← and → step through the same list.
    if (route()[0] === 'n' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
      const a = $(e.key === 'ArrowLeft' ? '.pager a.prev' : '.pager a.next');
      if (a) location.hash = a.getAttribute('href');
    }
  });
  window.addEventListener('hashchange', onRoute);
  new ResizeObserver(() => { if (state.g && isMap()) renderMap(); }).observe($('#stage'));

  // ---------- boot ----------
  const boot = (g) => { const first = state.lastRoute === null; setGraph(g); if (first) onRoute(); };
  if (window.__PLAN__) { setLive('', 'static export'); boot(window.__PLAN__); }
  else {
    const es = new EventSource('events');
    es.addEventListener('graph', (e) => { boot(JSON.parse(e.data)); setLive('on', 'live: updates as plan files change'); });
    es.onerror = () => setLive('off', 'disconnected. Is thinkmap serve running?');
  }
})();
</script>
</body>
