# Live demo: this repo plans itself in docs/plan/; every push exports that plan as one
# static HTML page (thinkmap export) and publishes it on GitHub Pages.
name: Live demo (GitHub Pages)
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the map links commits to tickets by [ID]
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: mkdir -p site && node bin/thinkmap.js export docs/plan --out site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
